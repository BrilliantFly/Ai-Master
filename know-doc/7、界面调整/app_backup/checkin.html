<!DOCTYPE html>
<html lang="zh-CN" data-theme="white">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>习惯打卡</title>
<link rel="stylesheet" href="styles.css">
<style>
.checkin-top{padding:20px 20px 16px;background:var(--primary-soft);margin:0 0 16px;border-radius:0 0 var(--radius-lg) var(--radius-lg);text-align:center}
.checkin-top h1{font-size:22px;font-weight:700;color:var(--text);margin:0}
.checkin-top .sub{font-size:13px;color:var(--text-secondary);margin-top:4px}
.streak-row{display:flex;gap:10px;padding:0 20px;margin-top:-8px;margin-bottom:16px}
.streak-card{flex:1;border-radius:var(--radius-md);padding:14px 10px;background:var(--surface);border:1px solid var(--border-light);text-align:center;box-shadow:var(--shadow-sm)}
.streak-card .num{font-size:24px;font-weight:700;color:var(--text)}
.streak-card .label{font-size:11px;color:var(--text-secondary);margin-top:2px}
.streak-card.accent .num{color:var(--primary)}
.tab-bar{display:flex;gap:0;padding:0 20px 14px;border-bottom:1px solid var(--border-light);margin-bottom:16px}
.tab-item2{flex:1;text-align:center;padding:8px 0;font-size:14px;font-weight:500;color:var(--text-tertiary);cursor:pointer;border-bottom:2px solid transparent;transition:color .25s ease,border-color .25s ease;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;-webkit-tap-highlight-color:transparent}
.tab-item2:hover{color:var(--text-secondary)}
.tab-item2.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab-item2 .badge{font-size:11px;color:var(--text-tertiary);margin-left:4px}
.goal-list{padding:0 20px 140px;display:flex;flex-direction:column;gap:12px}
.goal-card{border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border-light);padding:16px;box-shadow:var(--shadow-sm);transition:box-shadow .25s ease,border-color .25s ease;-webkit-tap-highlight-color:transparent}
.goal-card:hover{box-shadow:var(--shadow-md)}
.goal-card .g-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.goal-card .g-icon{font-size:32px;line-height:1}
.goal-card .g-name{font-size:16px;font-weight:600;color:var(--text);flex:1;margin-left:10px}
.goal-card .g-badge{font-size:10px;padding:2px 10px;border-radius:6px;background:var(--primary-soft);color:var(--primary);font-weight:500}
.goal-card .g-streak{font-size:12px;color:var(--warning);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:4px}
.goal-card .g-progress{margin-bottom:10px}
.goal-card .g-progress-bar{height:6px;border-radius:3px;background:var(--border-light);overflow:hidden}
.goal-card .g-progress-fill{height:100%;border-radius:3px;background:var(--accent-gradient);transition:width .5s ease;width:0%}
.goal-card .g-progress-label{font-size:10px;color:var(--text-tertiary);margin-top:3px;display:flex;justify-content:space-between}
.goal-card .g-footer{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border-light)}
.goal-card .g-week{display:flex;gap:3px}
.goal-card .g-week-day{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;background:var(--surface-soft);color:var(--text-tertiary)}
.goal-card .g-week-day.done{background:var(--success-soft);color:var(--success)}
.goal-card .g-week-day.today{border:1.5px solid var(--primary)}
.checkin-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-tertiary);transition:transform .25s ease,background .25s ease,border-color .25s ease,box-shadow .25s ease;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.checkin-btn:hover{transform:scale(1.05)}
.checkin-btn.checked{background:var(--success);border-color:var(--success);color:var(--text-inverse);box-shadow:0 4px 12px rgba(34,181,115,.3)}
.checkin-btn:active{transform:scale(.9)}
/* 左滑操作按钮由 shared.js + styles.css 共享实现 */

.fab{position:fixed;bottom:90px;right:calc(50% - 190px);width:56px;height:56px;border-radius:50%;background:var(--accent-gradient);color:var(--text-inverse);border:none;font-size:28px;cursor:pointer;box-shadow:var(--shadow-lg);z-index:50;display:flex;align-items:center;justify-content:center;transition:transform .25s ease,box-shadow .25s ease;font-family:inherit;-webkit-tap-highlight-color:transparent}
.fab:hover{transform:scale(1.08);box-shadow:0 12px 40px rgba(var(--primary-rgb),.3)}
.fab:active{transform:scale(.95)}
@media(min-width:420px){.fab{right:calc(50% - 190px)}}

.week-chart{padding:0 20px 20px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.wc-day{font-size:11px;color:var(--text-tertiary);margin-bottom:4px}
.wc-bar{height:60px;border-radius:var(--radius-sm);background:var(--surface-soft);position:relative;overflow:hidden;margin-bottom:4px}
.wc-fill{position:absolute;bottom:0;left:0;right:0;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:var(--accent-gradient);transition:height .5s ease}
.wc-val{font-size:10px;color:var(--text-secondary);font-weight:500}
.manage-item{display:flex;align-items:center;padding:14px 16px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border-light);margin-bottom:8px;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease;-webkit-tap-highlight-color:transparent}
.manage-item:hover{box-shadow:var(--shadow-sm)}
.manage-item .mi-icon{font-size:24px;margin-right:12px}
.manage-item .mi-info{flex:1}
.manage-item .mi-name{font-size:14px;font-weight:600;color:var(--text)}
.manage-item .mi-sub{font-size:11px;color:var(--text-tertiary)}
.manage-item .mi-action{font-size:12px;color:var(--danger);padding:6px 12px;border-radius:var(--radius-sm);border:none;background:var(--danger-soft);cursor:pointer;font-family:inherit}
.manage-item .mi-action:hover{background:var(--danger);color:var(--text-inverse)}
.manage-item.archived{opacity:.5}

.modal-overlay{position:fixed;inset:0;background:var(--overlay-bg,rgba(0,0,0,.35));z-index:300;display:flex;opacity:0;visibility:hidden;transition:opacity .25s var(--ease),visibility .25s}
.modal-overlay.open{opacity:1;visibility:visible}
.modal-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:420px;background:var(--bg-app);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:301;padding:24px 20px max(24px,env(safe-area-inset-bottom));transition:transform .3s cubic-bezier(.22,1,.36,1);max-height:85vh;overflow-y:auto}
.modal-overlay.open .modal-sheet{transform:translateX(-50%) translateY(0)}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 20px}
.modal-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:5px}
/* ===== Form input wrap with focus bar ===== */
.fg-input-wrap{position:relative;display:block}
.fg-input-wrap .focus-bar{position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:2px;background:var(--primary);opacity:0;transition:opacity .25s;pointer-events:none}
.fg-input-wrap:focus-within .focus-bar{opacity:1}
/* Custom select arrow */
.fg-input-wrap:has(select)::after{content:'';position:absolute;right:14px;top:50%;width:7px;height:7px;border:2px solid var(--text-tertiary);border-top:none;border-left:none;transform:translateY(-65%) rotate(45deg);pointer-events:none;transition:border-color .22s;z-index:1}
.fg-input-wrap:has(select):focus-within::after{border-color:var(--primary)}

.form-group textarea{resize:vertical;min-height:60px}
/* ===== Form-preview 卡片样式 ===== */
.form-card-header{font-size:13px;font-weight:600;color:var(--primary);margin-bottom:12px;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.form-card-header::after{content:'';flex:1;height:1px;background:var(--border);margin-left:8px}
.form-card-schedule{background:var(--bg-card,var(--card-bg,var(--surface)));border-radius:var(--radius-md);box-shadow:var(--card-shadow,var(--shadow-sm));padding:18px 18px 20px;margin-bottom:14px;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s cubic-bezier(.34,1.56,.64,1);animation:cardSlideIn .4s ease both}
.form-card-schedule:hover{transform:translateY(-2px);box-shadow:0 4px 20px var(--card-hover-shadow,rgba(0,0,0,.1))}
.form-card-schedule:active{transform:translateY(0)}
.form-card-schedule:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.form-card-schedule:nth-child(1){animation-delay:0s}
.form-card-schedule:nth-child(2){animation-delay:.06s}
.form-card-schedule:nth-child(3){animation-delay:.12s}
.form-card-schedule:nth-child(4){animation-delay:.18s}
.form-card-schedule:nth-child(5){animation-delay:.24s}
.form-card-schedule:nth-child(6){animation-delay:.30s}
.fg-label{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:5px;letter-spacing:.2px}
.fg-label .required{color:var(--danger);font-size:15px;line-height:1}
.fgs-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgs-full{margin-top:10px}
.mt-10{margin-top:10px}
.fgs-row.mt-10{margin-top:10px}
/* select 自定义箭头 */
.fg-input-wrap:has(.fg-select)::after{content:'';position:absolute;right:14px;top:50%;width:7px;height:7px;border:2px solid var(--text-tertiary);border-top:none;border-left:none;transform:translateY(-65%) rotate(45deg);pointer-events:none;transition:border-color .22s;z-index:1}
.fg-input-wrap:has(.fg-select):focus-within::after{border-color:var(--primary)}
.fg-input,.fg-select{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--input-bg);color:var(--text-primary,var(--text));font-size:14px;transition:border-color .22s,box-shadow .22s,background .22s;outline:none;font-family:inherit}
.fg-input:hover,.fg-select:hover{border-color:var(--input-border-hover,#c8ccd8);background:var(--input-bg-hover)}
.fg-input:active,.fg-select:active{border-color:var(--text-primary,var(--text))}
.fg-input:focus,.fg-select:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-alpha,rgba(var(--primary-rgb),.12));background:var(--input-bg-focus)}
.fg-input:focus-visible,.fg-select:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.fg-input::placeholder{color:var(--text-tertiary);font-style:italic;font-weight:400;font-size:13px}
input[type="date"].fg-input,input[type="time"].fg-input{min-height:42px;-webkit-appearance:none;appearance:none;color-scheme:var(--date-color-scheme,light)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:.3;height:24px}
.fg-select{-webkit-appearance:none;-moz-appearance:none;appearance:none;padding-right:34px;cursor:pointer}
.fg-select option{color:var(--text-primary,var(--text));background:var(--bg-card,var(--card-bg,var(--surface)))}
/* 折叠卡片 */
.form-section-sch{background:var(--bg-card,var(--card-bg,var(--surface)));border-radius:var(--radius-md);box-shadow:var(--card-shadow,var(--shadow-sm));overflow:hidden;margin-bottom:14px;animation:cardSlideIn .4s ease both;animation-delay:.24s}
.form-section-sch details{interpolate-size:allow-keywords}
.form-section-sch summary{display:flex;align-items:center;gap:8px;padding:14px 18px;cursor:pointer;color:var(--text-secondary);font-size:13px;font-weight:500;list-style:none;-webkit-user-select:none;user-select:none;transition:color .25s,background .25s}
.form-section-sch summary:hover{background:var(--primary-alpha,rgba(var(--primary-rgb),.04))}
.form-section-sch summary:active{transform:scale(.99)}
.form-section-sch summary:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.form-section-sch summary::-webkit-details-marker{display:none}
.form-section-sch summary .arrow{font-size:12px;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.form-section-sch details[open] summary{color:var(--primary);background:var(--primary-alpha,rgba(var(--primary-rgb),.04))}
.form-section-sch details[open] summary .arrow{transform:rotate(180deg)}
.form-section-sch details .section-body{padding:0 18px;opacity:0;transition:opacity .35s ease,padding .35s ease}
.form-section-sch details[open] .section-body{opacity:1;padding:0 18px 18px}
/* 按钮组（与 form-preview 一致） */
.btn-row{display:flex;gap:12px;margin-top:24px;padding-top:14px;border-top:1px solid var(--border)}
.btn-primary,.btn-secondary{flex:1;padding:13px 0;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s;position:relative;overflow:hidden;font-family:inherit;-webkit-tap-highlight-color:transparent}
.btn-primary{background:var(--accent-gradient);color:var(--text-inverse);box-shadow:0 4px 14px var(--primary-alpha,rgba(var(--primary-rgb),.3))}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--primary-alpha,rgba(var(--primary-rgb),.4))}
.btn-primary:active{transform:scale(.97);box-shadow:0 2px 8px var(--primary-alpha,rgba(var(--primary-rgb),.2))}
.btn-primary:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn-secondary{background:var(--bg-secondary,var(--surface-soft));color:var(--text-secondary)}
.btn-secondary:hover{background:var(--border);color:var(--text-primary,var(--text))}
.btn-secondary:active{transform:scale(.97)}
.btn-secondary:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn-primary:disabled,.btn-secondary:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-primary::after,.btn-secondary::after{content:'';position:absolute;left:50%;top:50%;width:100%;padding-bottom:100%;border-radius:50%;background:rgba(255,255,255,.22);transform:translate(-50%,-50%) scale(0);transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .35s;opacity:0;pointer-events:none}
.btn-primary:active::after,.btn-secondary:active::after{transform:translate(-50%,-50%) scale(2.5);opacity:1;transition-duration:0s}
.btn-primary:disabled::after,.btn-secondary:disabled::after{display:none}
/* 颜色选择器（form-preview 风格） */
.color-strip{display:flex;gap:10px;flex-wrap:wrap}
.color-opt{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;position:relative;transition:transform .22s,box-shadow .22s,border-color .22s;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.color-opt:hover{transform:scale(1.12);box-shadow:0 2px 8px rgba(0,0,0,.16)}
.color-opt:active{transform:scale(.92)}
.color-opt:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.color-opt.active{border-color:var(--text-primary,var(--text));transform:scale(1.08);box-shadow:0 0 0 3px var(--bg-card,var(--surface)),0 2px 8px rgba(0,0,0,.2)}
.color-opt.active::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:700;color:var(--text-inverse);mix-blend-mode:exclusion;text-shadow:0 0 3px rgba(0,0,0,.4),0 1px 4px rgba(0,0,0,.2)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ===== Icon picker overlay ===== */
.icon-preview-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--input-bg);cursor:pointer;transition:border-color .22s,background .22s}
.icon-preview-row:hover{border-color:var(--input-border-hover,#c8ccd8);background:var(--input-bg-hover)}
.icon-preview-row:active{transform:scale(.98)}
.icon-preview-row:focus-visible{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}
.icon-preview-row .ip-badge{width:40px;height:40px;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:22px;flex-shrink:0;color:var(--text-inverse)}
.icon-preview-row .ip-name{flex:1;font-size:14px;font-weight:500;color:var(--text-primary,var(--text))}
.icon-preview-row .ip-arrow{color:var(--text-tertiary);font-size:18px;transition:transform .3s}
.icon-preview-row:hover .ip-arrow{transform:translateX(3px)}

.ip-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.ip-overlay.open{opacity:1;visibility:visible}
.ip-modal{position:fixed;left:0;bottom:0;width:100%;max-height:68vh;z-index:1001;background:var(--bg-card,var(--card-bg,var(--surface)));border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:20px 20px 32px;transform:translateY(100%);transition:transform .35s cubic-bezier(.34,1.56,.64,1);overflow-y:auto}
.ip-overlay.open .ip-modal{transform:translateY(0)}
.ip-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.ip-modal-header h3{font-size:16px;font-weight:600}
.ip-modal-close{width:30px;height:30px;border:none;border-radius:50%;background:var(--bg-secondary,var(--surface-soft));font-size:16px;cursor:pointer;display:grid;place-items:center;color:var(--text-secondary);transition:background .2s,color .2s,transform .2s}
.ip-modal-close:hover{background:var(--border);color:var(--text-primary,var(--text))}
.ip-modal-close:active{transform:scale(.88)}
.ip-modal-close:focus-visible{outline:2px solid var(--primary);outline-offset:1px}

.ip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ip-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;border:1.5px solid transparent;border-radius:var(--radius-sm);cursor:pointer;transition:transform .2s,background .2s,border-color .2s;background:var(--bg-secondary,var(--surface-soft))}
.ip-item:hover{border-color:var(--primary);background:var(--primary-alpha,rgba(var(--primary-rgb),.08));transform:translateY(-2px)}
.ip-item:active{transform:scale(.94)}
.ip-item:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.ip-item .ip-ico{width:40px;height:40px;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:22px;color:var(--text-inverse)}
.ip-item .ip-txt{font-size:11px;color:var(--text-secondary);font-weight:500}
.ip-item.active{border-color:var(--primary);background:var(--primary)}
.ip-item.active .ip-ico{background:rgba(255,255,255,.2)!important}
.ip-item.active .ip-txt{color:var(--text-inverse)}

/* ===== Toggle switch ===== */
.switch-row{display:flex;justify-content:space-between;align-items:center}
.slider-toggle{width:48px;height:28px;border-radius:var(--radius-md);background:var(--border);cursor:pointer;position:relative;transition:background .3s,transform .3s;flex-shrink:0}
.slider-toggle.on{background:var(--primary)}
.slider-toggle:hover{transform:scale(1.04)}
.slider-toggle:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.slider-toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);transition:left .35s cubic-bezier(.34,1.56,.64,1),transform .35s cubic-bezier(.34,1.56,.64,1)}
.slider-toggle.on .knob{left:23px}
.slider-toggle:active{transform:scale(.94)}



.goal-card.color-border{border-left:4px solid var(--primary)}
.checkin-note{font-size:10px;color:var(--text-tertiary);margin:4px 0 0;padding:3px 6px;background:var(--surface-soft);border-radius:4px;line-height:1.4}
.form-actions{display:flex;gap:10px;margin-top:20px}
.form-actions button{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;transition:transform .25s ease,background .25s ease;border:none;position:relative;overflow:hidden}
.btn-cancel{background:var(--surface-soft);color:var(--text-secondary)}
.btn-cancel:hover{background:var(--border-light);color:var(--text)}
.btn-save{background:var(--accent-gradient);color:var(--text-inverse);box-shadow:var(--shadow-glow)}
.btn-save:hover{transform:translateY(-1px)}
.empty-state{text-align:center;padding:60px 20px}
.empty-state .icon{font-size:48px;opacity:.4;margin-bottom:12px}
.empty-state p{font-size:14px;color:var(--text-tertiary)}

/* ===== Keyboard focus indicators ===== */
.tab-item2:focus-visible,
.checkin-btn:focus-visible,
.fab:focus-visible,
.goal-card:focus-visible,
.manage-item:focus-visible,
.mi-action:focus-visible,
.icon-opt:focus-visible,
.color-opt:focus-visible,
.btn-cancel:focus-visible,
.btn-save:focus-visible,
.theme-trigger:focus-visible,
.theme-option:focus-visible,
.header-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ===== Button active states ===== */
.tab-item2:active,
.goal-card:active,
.manage-item:active,
.mi-action:active,
.icon-opt:active { transform: scale(.96); }
.btn-cancel:active,
.btn-save:active { transform: scale(.97); }

/* ===== Disabled states ===== */
.form-actions button:disabled,
.btn-save:disabled,
.btn-cancel:disabled { opacity: .5; cursor: not-allowed; pointer-events: none; }

/* ===== Custom scrollbar ===== */
.modal-sheet::-webkit-scrollbar { width: 4px; }
.modal-sheet::-webkit-scrollbar-track { background: transparent; }
.modal-sheet::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.modal-sheet::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

/* ===== Theme border overrides ===== */
[data-theme="glass"] .form-card-schedule,
[data-theme="glass"] .form-section-sch { border: 1px solid rgba(255,255,255,.18); }
[data-theme="orangold"] .form-card-schedule,
[data-theme="orangold"] .form-section-sch { border: 1px solid rgba(240,160,32,.2); }

/* ===== Accessibility ===== */
html { overscroll-behavior: contain; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* ===== Responsive ===== */

/* 视口切换动画 */
.tab-panel { animation: viewFadeIn .3s var(--ease-out-expo); }

/* Checkin 按钮打勾弹跳 */
.checkin-btn.checked { animation: popCheck .35s var(--ease-spring); }

/* Stats 柱状图入场 */
.wc-fill { animation: barGrow .5s var(--ease-out-expo); }

/* 连续火焰脉冲 */
.g-streak { display:flex; align-items:center; gap:4px; }
.g-streak .fire-icon { display:inline-block; animation: firePulse 2s infinite; }

/* streak card hover */
.streak-card { transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
.streak-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

/* 粗指针触摸目标 */
@media (pointer: coarse) {
  .color-opt, .ip-modal-close { min-width: 44px; min-height: 44px; }
}

/* Glass/orangold 主题覆盖移至 styles.css 共享 */
html[data-theme="glass"] .streak-card { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); }
html[data-theme="orangold"] .streak-card { background:rgba(200,170,140,.08); }

/* 平板断点 */
@media (min-width: 768px) and (max-width: 1024px) {
  .goal-list, #statsView>div, #manageView>div { max-width: 600px; margin-left: auto; margin-right: auto; }
  .streak-row { max-width: 600px; margin-left: auto; margin-right: auto; }
  .tab-bar { max-width: 600px; margin-left: auto; margin-right: auto; }
}
@media (min-width: 1024px) {
  .checkin-top, .streak-row, .tab-bar { max-width: 700px; margin-left: auto; margin-right: auto; }
  .goal-list { max-width: 700px; margin-left: auto; margin-right: auto; }
  #statsView>div, #manageView>div { max-width: 700px; margin-left: auto; margin-right: auto; }
}

/* 横屏 */
@media (orientation: landscape) and (max-height: 500px) {
  .checkin-top { padding: 12px 14px 10px; }
  .goal-list { padding: 0 14px 100px; }
  .fab { bottom: 70px; }
}

@media (max-width: 420px) {
  .checkin-top { padding: 16px 14px 12px; }
  .checkin-top h1 { font-size: 19px; }
  .streak-row { padding: 0 14px; }
  .goal-list { padding: 0 14px 120px; }
  .tab-bar { padding: 0 14px 12px; }
  .fab { right: 20px; bottom: 80px; }
  .modal-sheet { padding: 20px 16px max(20px, env(safe-area-inset-bottom)); }
  .ip-grid { grid-template-columns: repeat(3, 1fr); }
  .color-strip { gap: 8px; }
  .color-opt { width: 28px; height: 28px; }
  .form-section-sch .section-body { padding: 0 14px 14px; }
  .fgs-row { grid-template-columns: 1fr; gap: 8px; }
  .form-card-schedule { padding: 14px 14px 16px; }
  .form-card-header { font-size: 12px; }
}
</style>
</head>

    <a class="tab-item active" href="checkin.html"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></span><span>打卡</span></a>
    <a class="tab-item" href="customer.html"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg></span><span>客户</span></a>
    <a class="tab-item" href="profile.html"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span>我的</span></a>

</div>

        <label class="fg-label">🎨 图标 <span class="required">*</span></label>
        <div class="icon-preview-row" id="iconPreview" tabindex="0">
          <div class="ip-badge" id="iconPreviewBadge" style="background:#5b5bd6">🎯</div>
          <span class="ip-name" id="iconPreviewName">目标</span>
          <span class="ip-arrow">›</span>
        </div>
      </div>
      <div class="fgs-full">
        <label class="fg-label" for="gName">📝 名称 <span class="required">*</span></label>

              </select>

          </div>
        </div>
        <div>

          </div>
        </div>

      <div class="ip-item" tabindex="0" role="button" data-icon="🎵" data-name="音乐" data-color="#8b5cf6" aria-label="音乐 图标"><div class="ip-ico" style="background:#8b5cf6">🎵</div><span class="ip-txt">音乐</span></div>
      <div class="ip-item" tabindex="0" role="button" data-icon="📷" data-name="摄影" data-color="#14b8a6" aria-label="摄影 图标"><div class="ip-ico" style="background:#14b8a6">📷</div><span class="ip-txt">摄影</span></div>
      <div class="ip-item" tabindex="0" role="button" data-icon="🌄" data-name="早起" data-color="#f59e0b" aria-label="早起 图标"><div class="ip-ico" style="background:#f59e0b">🌄</div><span class="ip-txt">早起</span></div>
      <div class="ip-item" tabindex="0" role="button" data-icon="📝" data-name="日记" data-color="#6366f1" aria-label="日记 图标"><div class="ip-ico" style="background:#6366f1">📝</div><span class="ip-txt">日记</span></div>
      <div class="ip-item" tabindex="0" role="button" data-icon="👨‍💻" data-name="编程" data-color="#3b82f6" aria-label="编程 图标"><div class="ip-ico" style="background:#3b82f6">👨‍💻</div><span class="ip-txt">编程</span></div>
      <div class="ip-item" tabindex="0" role="button" data-icon="🌱" data-name="习惯" data-color="#22c55e" aria-label="习惯 图标"><div class="ip-ico" style="background:#22c55e">🌱</div><span class="ip-txt">习惯</span></div>
      <div class="ip-item" tabindex="0" role="button" data-icon="❤️" data-name="关爱" data-color="#ef4444" aria-label="关爱 图标"><div class="ip-ico" style="background:#ef4444">❤️</div><span class="ip-txt">关爱</span></div>
      <div class="ip-item" tabindex="0" role="button" data-icon="💰" data-name="理财" data-color="#f59e0b" aria-label="理财 图标"><div class="ip-ico" style="background:#f59e0b">💰</div><span class="ip-txt">理财</span></div>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script src="theme.js"></script>
<script>
(function(){
  var GK='know_checkin_goals',RK='know_checkin_records';
  function goals(){return ld(GK)||[]}
  function saveGoals(g){sd(GK,g)}
  function records(){return ld(RK)||{}}
  function saveRecords(r){sd(RK,r)}

  var T=new Date();
  var today=fm(T);

  function getStreak(goalId,recs){
    var days=recs[goalId]||[],s=0,c=new Date(T);
    while(true){
      var ds=fm(c);
      if(days.indexOf(ds)>-1){s++;c.setDate(c.getDate()-1)}
      else break;
    }
    return s;
  }

  function getWeekDays(goalId,recs){
    var days=recs[goalId]||[],result=[];
    var m=new Date(T);m.setDate(m.getDate()-m.getDay()+1);
    for(var i=0;i<7;i++){
      var d=new Date(m);d.setDate(m.getDate()+i);
      result.push({date:fm(d),done:days.indexOf(fm(d))>-1,isToday:fm(d)===today});
    }
    return result;
  }

  function renderCheckin(){
    var list=document.getElementById('goalList'),gs=goals(),recs=records();
    var active=gs.filter(function(g){return !g.archived});
    if(active.length===0){
      list.innerHTML='<div class="empty-state"><div class="icon">🎯</div><p>还没有目标<br>点击右下角+新建</p></div>';
      updateStats();
      return;
    }
    var html='';
    active.forEach(function(g){
      var streak=getStreak(g.id,recs),wk=getWeekDays(g.id,recs);
      var checkedToday=(recs[g.id]||[]).indexOf(today)>-1;
      var weekDone=wk.filter(function(w){return w.done}).length;
      var pct=Math.round((weekDone/7)*100);
      var borderCol=g.color||'var(--cat-other)';
      var nk='know_checkin_notes',notes=ld(nk)||{};
      var todayNote=notes[g.id]&&notes[g.id][today]||'';
      html+='<div class="goal-card-wrap" data-id="'+g.id+'">';
      html+='<div class="goal-card color-border" role="button" tabindex="0" style="border-left-color:'+borderCol+'">';
      html+='<div class="g-header"><span class="g-icon">'+htmlEscape(g.icon)+'</span><span class="g-name">'+htmlEscape(g.name)+'</span><span class="g-badge" style="background:'+borderCol+'22;color:'+borderCol+'">';
      if(g.freqPeriod&&g.freqTarget>1){html+=g.freqTarget+'/'+({daily:'天',weekly:'周',monthly:'月'}[g.freqPeriod]||'天')}
      else if(g.freqPeriod){html+=g.freqPeriod==='daily'?'每天':(g.freqPeriod==='weekly'?'每周':'每月')}
      else{html+=g.repeat==='weekday'?'工作日':'每天'}
      html+='</span></div>';
      var targetStr='';if(g.target&&g.unit)targetStr='<span style="font-size:12px;color:var(--text-secondary);margin-left:6px;font-weight:400">目标 '+g.target+htmlEscape(g.unit)+'</span>';
      html+='<div class="g-streak"><span class="fire-icon">🔥</span> 连续 '+streak+' 天'+targetStr+'</div>';
      if(g.desc)html+='<div style="font-size:11px;color:var(--text-tertiary);margin:-2px 0 6px;line-height:1.4">📌 '+htmlEscape(g.desc)+'</div>';
      if(g.motto)html+='<div style="font-size:11px;color:var(--text-tertiary);margin:-4px 0 8px">💬 '+htmlEscape(g.motto)+'</div>';
      if(g.endDate)html+='<div style="font-size:10px;color:var(--warning);margin:-2px 0 6px">⏳ 截止 '+htmlEscape(g.endDate)+'</div>';
      html+='<div class="g-progress"><div class="g-progress-bar"><div class="g-progress-fill" style="width:'+pct+'%"></div></div><div class="g-progress-label"><span>本周 '+weekDone+'/7</span><span>'+pct+'%</span></div></div>';
      if(todayNote)html+='<div class="checkin-note">📝 '+htmlEscape(todayNote)+'</div>';
      html+='<div class="g-footer">';
      html+='<div class="g-week">';
      wk.forEach(function(w){
        html+='<div class="g-week-day'+(w.done?' done':'')+(w.isToday?' today':'')+'">'+(w.isToday?'今':['日','一','二','三','四','五','六'][new Date(w.date).getDay()])+'</div>';
      });
      html+='</div>';
      html+='<button type="button" class="checkin-btn'+(checkedToday?' checked':'')+'" onclick="toggleCheckin(\''+g.id+'\')">'+(checkedToday?'✓':'○')+'</button>';
      html+='</div></div>'; /* ← 关闭 goal-card */
      /* 指尖时光风格 — 操作按钮在 card 外部作为兄弟元素 */
      html+='<div class="swipe-actions"><button class="swipe-action action-edit" onclick="event.stopPropagation();editGoal(\''+g.id+'\')" aria-label="编辑" tabindex="0"><span class="sa-content"><span class="sa-icon">✏️</span><span class="sa-label">编辑</span></span></button><button class="swipe-action action-archive" onclick="event.stopPropagation();archiveGoal(\''+g.id+'\')" aria-label="结束" tabindex="0"><span class="sa-content"><span class="sa-icon">📦</span><span class="sa-label">结束</span></span></button></div>';
      html+='</div>'; /* ← 关闭 goal-card-wrap */
    });
    list.innerHTML=html;
    list.classList.remove('stagger-enter');void list.offsetWidth;list.classList.add('stagger-enter');
    updateStats();
  }

  function toggleCheckin(id){
    var recs=records(),gs=goals(),nk='know_checkin_notes';
    var notes=ld(nk)||{};
    var g=null;for(var i=0;i<gs.length;i++){if(gs[i].id===id){g=gs[i];break}}
    if(!g)return;
    if(!recs[id])recs[id]=[];
    var idx=recs[id].indexOf(today);
    if(idx>-1){
      recs[id].splice(idx,1);
      if(notes[id])delete notes[id][today];
    } else {
      recs[id].push(today);
      var note='';
      if(!notes[id])notes[id]={};notes[id][today]=note;
    }
    saveRecords(recs);
    sd(nk,notes);
    var curTab=document.querySelector('.tab-item2.active');
    if(curTab&&curTab.getAttribute('data-tab')==='checkin')renderCheckin();
    else if(curTab&&curTab.getAttribute('data-tab')==='stats')renderStats();
    else if(curTab&&curTab.getAttribute('data-tab')==='manage')renderManage();
    else switchTab('checkin');
  }
  window.toggleCheckin=toggleCheckin;

  function updateStats(){
    var gs=goals(),recs=records(),active=gs.filter(function(g){return !g.archived});
    var checked=0;active.forEach(function(g){if((recs[g.id]||[]).indexOf(today)>-1)checked++});
    document.getElementById('todayCount').textContent=checked+'/'+active.length;
    document.getElementById('todaySummary').textContent='今日打卡 '+checked+'/'+active.length;

    var best=0;active.forEach(function(g){var s=getStreak(g.id,recs);if(s>best)best=s});
    document.getElementById('bestStreak').textContent=best+'天';

    var totalDays=new Date(T.getFullYear(),T.getMonth()+1,0).getDate();
    var totalChecks=0,totalPossible=0;
    active.forEach(function(g){
      var days=recs[g.id]||[];
      for(var d=1;d<=T.getDate();d++){
        var ds=T.getFullYear()+'-'+String(T.getMonth()+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        if(days.indexOf(ds)>-1)totalChecks++;
        totalPossible++;
      }
    });
    var rate=totalPossible>0?Math.round((totalChecks/totalPossible)*100):0;
    document.getElementById('monthRate').textContent=rate+'%';
  }

  function renderStats(){
    var gs=goals(),recs=records(),active=gs.filter(function(g){return !g.archived});
    var chart=document.getElementById('weekChart');
    var m=new Date(T);m.setDate(m.getDate()-m.getDay()+1);
    var wd=['一','二','三','四','五','六','日'];
    var html='';
    for(var i=0;i<7;i++){
      var d=new Date(m);d.setDate(m.getDate()+i);var ds=fm(d);
      var done=0;active.forEach(function(g){if((recs[g.id]||[]).indexOf(ds)>-1)done++});
      var pct=active.length>0?Math.round((done/active.length)*100):0;
      html+='<div><div class="wc-day">'+wd[i]+'</div><div class="wc-bar"><div class="wc-fill" style="height:'+pct+'%"></div></div><div class="wc-val">'+done+'/'+active.length+'</div></div>';
    }
    chart.innerHTML=html;

    var cal=document.getElementById('monthCalGrid');
    var dim=new Date(T.getFullYear(),T.getMonth()+1,0).getDate();
    var fd=new Date(T.getFullYear(),T.getMonth(),1).getDay();fd=fd===0?6:fd-1;
    cal.innerHTML='';
    for(var i=fd-1;i>=0;i--){var b=document.createElement('div');b.className='cal-day other';b.textContent='';cal.appendChild(b)}
    for(var d=1;d<=dim;d++){
      var b=document.createElement('div'),ds=T.getFullYear()+'-'+String(T.getMonth()+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      b.className='cal-day';if(d===T.getDate())b.classList.add('today');
      b.textContent=d;
      var hasCheck=false;active.forEach(function(g){if((recs[g.id]||[]).indexOf(ds)>-1)hasCheck=true});
      if(hasCheck){var dot=document.createElement('span');dot.className='dot';dot.style.background='var(--success)';b.appendChild(dot)}
      cal.appendChild(b);
    }
  }

  function renderManage(){
    var gs=goals(),active=gs.filter(function(g){return !g.archived}),archived=gs.filter(function(g){return g.archived});
    var aDiv=document.getElementById('activeGoals'),arDiv=document.getElementById('archivedGoals');

    function renderList(arr,isArchived){
      if(arr.length===0)return '<div style="text-align:center;padding:30px;color:var(--text-tertiary);font-size:13px">暂无</div>';
      var h='';arr.forEach(function(g){
        h+='<div class="manage-item'+(isArchived?' archived':'')+'" role="button" tabindex="0" onclick="editGoal(\''+g.id+'\')">';
        h+='<span class="mi-icon">'+htmlEscape(g.icon)+'</span><div class="mi-info"><div class="mi-name">'+htmlEscape(g.name)+'</div><div class="mi-sub">'+(g.freqPeriod?({daily:'每天',weekly:'每周',monthly:'每月'}[g.freqPeriod]||'每天'):(g.repeat==='weekday'?'工作日':'每天'))+' · '+htmlEscape(g.category||'健康')+' · '+(g.target||1)+htmlEscape(g.unit||'次')+'/天'+(g.endDate?' · 截止'+htmlEscape(g.endDate):'')+' · 创建于'+htmlEscape(g.created)+'</div></div>';
        if(!isArchived)h+='<button type="button" class="mi-action" onclick="event.stopPropagation();archiveGoal(\''+g.id+'\')">结束</button>';
        else h+='<button type="button" class="mi-action" onclick="event.stopPropagation();archiveGoal(\''+g.id+'\')" style="background:var(--primary-soft);color:var(--primary)">恢复</button>';
        h+='</div>';
      });
      return h;
    }
    aDiv.innerHTML=renderList(active,false);
    arDiv.innerHTML=renderList(archived,true);
  }

  function archiveGoal(id, skipUndo){
    var gs=goals(),idx=-1;
    for(var i=0;i<gs.length;i++){if(gs[i].id===id){idx=i;break}}
    if(idx===-1)return;
    var wasArchived=gs[idx].archived;
    gs[idx].archived=!wasArchived;
    saveGoals(gs);
    var reRender=function(){
      if(document.querySelector('.tab-item2.active')?.getAttribute('data-tab')==='manage'){renderManage()}
      else{renderCheckin()}
    };
    reRender();
    if(!skipUndo){
      var msg=wasArchived?'已恢复目标':'已结束目标';
      showUndoToast(msg,function(){
        /* 撤销：恢复状态 */
        gs[idx].archived=wasArchived;
        saveGoals(gs);
        reRender();
      });
    }
  }
  window.archiveGoal=archiveGoal;

  function switchTab(tab){
    document.querySelectorAll('.tab-item2').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===tab)});
    var cv=document.getElementById('checkinView'),sv=document.getElementById('statsView'),mv=document.getElementById('manageView');
    cv.style.display=tab==='checkin'?'block':'none';
    sv.style.display=tab==='stats'?'block':'none';
    mv.style.display=tab==='manage'?'block':'none';
    var p=tab==='checkin'?cv:(tab==='stats'?sv:mv);
    if(p){void p.offsetWidth;p.style.animation='none';void p.offsetWidth;p.style.animation='';}
    if(tab==='stats')renderStats();
    if(tab==='manage')renderManage();
  }
  window.switchTab=switchTab;

  function openGoalForm(editData){
    document.getElementById('editGoalId').value=editData?editData.id:'';
    document.getElementById('formTitle').textContent=editData?'编辑目标':'新建目标';
    document.getElementById('gName').value=editData?editData.name:'';
    document.getElementById('gTarget').value=editData?editData.target||1:'';
    document.getElementById('gUnit').value=editData?editData.unit||'次':'次';
    document.getElementById('gCategory').value=editData?editData.category||'健康':'健康';
    document.getElementById('gFreqTarget').value=editData?editData.freqTarget||1:'';
    document.getElementById('gFreqPeriod').value=editData?editData.freqPeriod||'daily':'daily';
    document.getElementById('gRemind').value=editData?editData.remindTime:'09:00';
    document.getElementById('gTimePeriod').value=editData?editData.timePeriod||'all':'all';
    document.getElementById('gStartDate').value=editData?editData.startDate:fm(new Date());
    document.getElementById('gEndDate').value=editData?editData.endDate||'':'';
    document.getElementById('gDesc').value=editData?editData.desc||'':'';
    document.getElementById('gMotto').value=editData?editData.motto:'';
    /* Sync slider-toggle for backfill */
    var bf=editData?editData.allowBackfill!==false:true;
    document.getElementById('backfillToggle').classList.toggle('on',bf);
    document.getElementById('backfillToggle').setAttribute('aria-checked',bf);
    document.getElementById('gAllowBackfill').value=bf?'true':'false';
    /* Sync icon preview */
    curIcon=editData?editData.icon||'🎯':'🎯';
    curName=editData?editData.name||'目标':'目标';
    curColor=editData?editData.color||'#5b5bd6':'#5b5bd6';
    document.getElementById('iconPreviewBadge').style.background=curColor;
    document.getElementById('iconPreviewBadge').textContent=curIcon;
    document.getElementById('iconPreviewName').textContent=curName;
    /* Active state in overlay grid */
    document.querySelectorAll('#iconGrid .ip-item').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-icon')===curIcon)});
    document.querySelectorAll('.color-opt').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-color')===(editData?editData.color||'#5b5bd6':'#5b5bd6'))});
    document.getElementById('formOverlay').classList.add('open');
  }
  window.openGoalForm=openGoalForm;

  /* ===== Icon picker overlay ===== */
  var overlay=document.getElementById('iconOverlay');
  var preview=document.getElementById('iconPreview');
  var closeBtn=document.getElementById('iconClose');
  var curIcon='🎯',curName='目标',curColor='#5b5bd6';

  preview.addEventListener('click',function(){overlay.classList.add('open')});
  preview.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();overlay.classList.add('open')}});
  closeBtn.addEventListener('click',function(){overlay.classList.remove('open')});
  overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.classList.remove('open')});

  document.querySelectorAll('#iconGrid .ip-item').forEach(function(item){
    item.addEventListener('click',function(){
      document.querySelectorAll('#iconGrid .ip-item').forEach(function(i){i.classList.remove('active')});
      item.classList.add('active');
      curIcon=item.getAttribute('data-icon');
      curName=item.getAttribute('data-name');
      curColor=item.getAttribute('data-color');
      overlay.classList.remove('open');
      var badge=document.getElementById('iconPreviewBadge');
      var name=document.getElementById('iconPreviewName');
      badge.style.background=curColor;
      badge.textContent=curIcon;
      name.textContent=curName;
    });
    item.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '){e.preventDefault();item.click()}
    });
  });

  /* ===== Slider-toggle ===== */
  var backfillToggle=document.getElementById('backfillToggle');
  var backfillInput=document.getElementById('gAllowBackfill');
  backfillToggle.addEventListener('click',function(){
    backfillToggle.classList.toggle('on');
    var checked=backfillToggle.classList.contains('on');
    backfillToggle.setAttribute('aria-checked',checked);
    backfillInput.value=checked?'true':'false';
  });
  backfillToggle.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();backfillToggle.click()}
  });
  function pickColor(el){
    document.querySelectorAll('.color-opt').forEach(function(b){b.classList.remove('active')});
    el.classList.add('active');
  }
  window.pickColor=pickColor;

  function editGoal(id){
    var gs=goals();for(var i=0;i<gs.length;i++){if(gs[i].id===id){openGoalForm(gs[i]);return}}
  }
  window.editGoal=editGoal;

  function closeGoalForm(e){
    if(e&&e.target!==document.getElementById('formOverlay'))return;
    document.getElementById('formOverlay').classList.remove('open');
  }
  window.closeGoalForm=closeGoalForm;

  function saveGoal(){
    var id=document.getElementById('editGoalId').value;
    var nameEl=document.getElementById('gName');
    if(!nameEl){return}
    var name=nameEl.value.trim();
    var target=parseInt(document.getElementById('gTarget').value)||1;
    var unit=document.getElementById('gUnit').value;
    var category=document.getElementById('gCategory').value;
    var freqTarget=parseInt(document.getElementById('gFreqTarget').value)||1;
    var freqPeriod=document.getElementById('gFreqPeriod').value;
    var remindTime=document.getElementById('gRemind').value;
    var timePeriod=document.getElementById('gTimePeriod').value;
    var startDate=document.getElementById('gStartDate').value;
    var endDate=document.getElementById('gEndDate').value||'';
    var desc=document.getElementById('gDesc').value.trim();
    var motto=document.getElementById('gMotto').value.trim();
    var icon=curIcon||'🎯';
    var colorEl=document.querySelector('.color-opt.active');
    var color=colorEl?colorEl.getAttribute('data-color'):'#5b5bd6';
    var allowBackfill=document.getElementById('gAllowBackfill').value==='true';
    if(!name){showToast('请输入目标名称','warning');return}
    if(!startDate){startDate=today}
    var gs=goals();
    if(id){
      for(var i=0;i<gs.length;i++){if(gs[i].id===id){gs[i].name=name;gs[i].icon=icon;gs[i].color=color;gs[i].target=target;gs[i].unit=unit;gs[i].category=category;gs[i].freqTarget=freqTarget;gs[i].freqPeriod=freqPeriod;gs[i].remindTime=remindTime;gs[i].timePeriod=timePeriod;gs[i].startDate=startDate;gs[i].endDate=endDate;gs[i].desc=desc;gs[i].allowBackfill=allowBackfill;gs[i].motto=motto;break}}
    } else {
      gs.push({id:gid(),name:name,icon:icon,color:color,target:target,unit:unit,category:category,freqTarget:freqTarget,freqPeriod:freqPeriod,remindTime:remindTime,timePeriod:timePeriod,startDate:startDate,endDate:endDate,desc:desc,allowBackfill:allowBackfill,motto:motto,created:today,archived:false});
    }
    saveGoals(gs);closeGoalForm();renderCheckin();
  }
  window.saveGoal=saveGoal;

  function init(){
    var gs=goals();
    if(gs.length===0){
      var fd=new Date(T);fd.setDate(fd.getDate()+30);var futureDate=fm(fd);
      gs.push({id:gid(),name:'每日阅读',icon:'📖',color:'#5b5bd6',target:30,unit:'分钟',category:'学习',freqTarget:1,freqPeriod:'daily',remindTime:'21:00',timePeriod:'evening',startDate:today,endDate:'',desc:'每天至少读30分钟，提升认知',allowBackfill:true,motto:'知识改变命运',created:today,archived:false});
      gs.push({id:gid(),name:'晨跑',icon:'🏃',color:'#f97316',target:5,unit:'公里',category:'健康',freqTarget:3,freqPeriod:'weekly',remindTime:'06:30',timePeriod:'morning',startDate:today,endDate:'',desc:'每周跑3次，保持体能',allowBackfill:true,motto:'跑出好身材',created:today,archived:false});
      gs.push({id:gid(),name:'喝水',icon:'💧',color:'#06b6d4',target:8,unit:'杯',category:'健康',freqTarget:1,freqPeriod:'daily',remindTime:'09:00',timePeriod:'all',startDate:today,endDate:'',desc:'每天8杯水，设置整点提醒',allowBackfill:true,motto:'多喝水皮肤好',created:today,archived:false});
      gs.push({id:gid(),name:'冥想',icon:'🧘',color:'#a855f7',target:15,unit:'分钟',category:'健康',freqTarget:5,freqPeriod:'weekly',remindTime:'22:00',timePeriod:'evening',startDate:today,endDate:futureDate,desc:'每周冥想5天，缓解焦虑',allowBackfill:true,motto:'静心养神',created:today,archived:false});
